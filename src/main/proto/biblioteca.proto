syntax = "proto3";

package biblioteca;

option java_multiple_files = true;
option java_package = "br.mackenzie.biblioteca.grpc";
option java_outer_classname = "BibliotecaProto";

// Mensagens
message Livro {
  string id = 1;
  string titulo = 2;
  string autor = 3;
  int32 ano = 4;
  string isbn = 5;
}

message CadastrarLivroRequest {
  string titulo = 1;
  string autor = 2;
  int32 ano = 3;
  string isbn = 4;
}

message CadastrarLivroResponse {
  string id = 1;
  string mensagem = 2;
}

message ListarLivrosPorAutorRequest {
  string autor = 1;
}

message RegistrarEmprestimosRequest {
  string usuario = 1;
  string livro_id = 2;
}

message EmprestimoResumo {
  int32 total_emprestimos = 1;
  int64 tempo_processamento_ms = 2;
  string mensagem = 3;
}

message ChatRequest {
  string mensagem = 1;
}

message ChatResponse {
  string sugestao_livro = 1;
  string resposta_bibliotecario = 2;
}

// Serviço gRPC
service BibliotecaService {
  // 1. Unary RPC
  rpc CadastrarLivro(CadastrarLivroRequest) returns (CadastrarLivroResponse);

  // 2. Server Streaming RPC
  rpc ListarLivrosPorAutor(ListarLivrosPorAutorRequest) returns (stream Livro);

  // 3. Client Streaming RPC
  rpc RegistrarEmprestimos(stream RegistrarEmprestimosRequest) returns (EmprestimoResumo);

  // 4. Bidirectional Streaming RPC
  rpc ChatBibliotecario(stream ChatRequest) returns (stream ChatResponse);
}